{% extends 'base.html' %}
{% block title %}Login | Sarkari Job Portal{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <h2>Login</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
        <p class="mt-3">Don't have an account? <a href="{% url 'accounts:register' %}">Register here</a></p>
    </div>
</div>
{% endblock %}
